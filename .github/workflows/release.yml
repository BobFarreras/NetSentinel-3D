name: Release NetSentinel Deployment

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Windows deps (Npcap SDK for Packet.lib)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkUrl = 'https://npcap.com/dist/npcap-sdk-1.13.zip'
          $zipPath = Join-Path $env:RUNNER_TEMP 'npcap-sdk.zip'
          $outDir = Join-Path $env:RUNNER_TEMP 'npcap-sdk'

          Invoke-WebRequest -Uri $sdkUrl -OutFile $zipPath
          if (Test-Path $outDir) { Remove-Item -Recurse -Force $outDir }
          Expand-Archive -Path $zipPath -DestinationPath $outDir

          $libDir = Get-ChildItem -Path $outDir -Recurse -Directory | Where-Object { $_.FullName -match '\\Lib\\x64$' } | Select-Object -First 1
          if (-not $libDir) { throw "No se encontro Lib\\x64 dentro del Npcap SDK" }

          $packetLib = Join-Path $libDir.FullName 'Packet.lib'
          if (-not (Test-Path $packetLib)) { throw "No se encontro Packet.lib en $($libDir.FullName)" }

          # Para MSVC, el linker resuelve libs via la variable de entorno LIB.
          "LIB=$($libDir.FullName);$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Windows deps (Npcap installer asset for Packet.dll at runtime)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPCAP_DEPS_TAG: deps-npcap
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null

          # Descarga un asset llamado "npcap-installer.exe" desde una Release interna (tag deps-npcap).
          # Debes crear esa release una vez y subir el exe como asset.
          gh release download "$env:NPCAP_DEPS_TAG" --pattern "npcap-installer.exe" --dir "src-tauri/resources"

          if (-not (Test-Path "src-tauri/resources/npcap-installer.exe")) {
            throw "No se encontro src-tauri/resources/npcap-installer.exe tras descargar el asset."
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Check version sync (tag vs manifests)
        shell: pwsh
        run: |
          npm run release:check-versions -- --tag "${{ github.ref_name }}"

      - name: Generate Tauri config (with Npcap bundling)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/release/make_tauri_config_with_npcap.mjs

      - name: Build and Upload NetSentinel
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NetSentinel Operation ${{ github.ref_name }}
          releaseBody: 'See the assets to download this version and run.'
          releaseDraft: true
          prerelease: false
          # Nota: usamos config alterna para incluir el instalador de Npcap dentro del setup.
          args: --config src-tauri/tauri.conf.with_npcap.json ${{ matrix.args }}
